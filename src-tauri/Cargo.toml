[package]
name = "aws-tunnel-desk"
version = "0.2.0"
description = "A secure cross-platform manager for AWS Systems Manager tunnels"
authors = ["AWS Tunnel Desk contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

keywords = ["aws", "ssm", "tunnel", "desktop"]
categories = ["network-programming"]

[lib]
name = "aws_tunnel_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
